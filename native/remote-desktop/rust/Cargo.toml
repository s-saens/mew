[package]
name = "mew-desktop-engine"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
datachannel-sys = { version = "=0.23.0", features = ["vendored", "media"] }
libloading = "0.8.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"

[profile.release]
lto = true
strip = true
